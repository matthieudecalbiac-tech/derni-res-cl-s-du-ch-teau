# QA · Les Clés du Château
#
# Deux profils d'exécution selon le trigger :
#
#   • Pull Request vers main (job qa-fast) :
#     parcours rapide ~10-12 min, chromium uniquement (1 seul project Playwright).
#     Lance les 4 agents — validation-donnees, console-errors, a11y-axe, et
#     playwright-e2e restreint à chromium-desktop via E2E_PROJECTS. Les 4
#     rapports sont présents, le baseline check --strict peut valider.
#     Les 3 projects Playwright (chromium + webkit + mobile-safari) ne
#     tournent que sur push main via qa-full.
#
#   • Push sur main (job qa-full) :
#     parcours complet ~30-40 min, 3 navigateurs (chromium-desktop + webkit-desktop
#     + mobile-safari), timeout 60 min. Lance les 4 agents via `npm run qa:fast`
#     sans restriction d'env vars.
#     Historique mobile-safari : auparavant EXCLU de la CI car trop lent sous
#     Ubuntu headless (waitForLoadState networkidle qui ne terminait pas sous
#     45 min). Réactivé le 2026-04-24 après deux fixes : networkidle remplacé
#     par domcontentloaded (commit 69df395) + météo vitrine découplée du fetch
#     avec AbortController (commit b47b70d). Timeout CI maintenu à 60 min par
#     sécurité le temps de valider la stabilité en production. À reconsidérer
#     après 5-10 runs qa-full verts stables (réduction possible à 30-40 min
#     comme avant l'exclusion).
#
# Verdict final dans les 2 jobs : scripts/qa-check-baseline.cjs --strict.
# Les seuils de tolérance sont dans qa-baseline.json à la racine (voir champs
# "dette" pour le détail de chaque métrique acceptée).
# Une régression sous ces seuils = CI rouge. Une nouvelle dette assumée =
# commit chore(qa): révision baseline séparé avec justification.
#
# Variables d'env supportées par les agents pour restreindre les navigateurs
# (toujours disponibles, plus utilisées par la CI depuis la réactivation
# mobile-safari du 2026-04-24, utiles en local pour débugger un navigateur) :
#   CONSOLE_SKIP_BROWSERS=<list> → agent console-errors
#   A11Y_SKIP_BROWSERS=<list>    → agent a11y-axe
#   E2E_PROJECTS=<list>          → agent playwright-e2e
#
# Artifacts : qa-reports/ est uploadé dans tous les cas (if: always()) pour
# permettre de débugger même quand la CI est rouge. Rétention 14 jours en PR,
# 30 jours sur push main. Consultables dans l'onglet "Artifacts" du run.

name: QA · Les Clés du Château

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  qa-fast:
    name: QA rapide (PR vers main)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ⚠ FAIL-FAST — avant l installation de Playwright, comme validate:chateaux
      # (PR #12). Une derive de schema doit couter 5 secondes, pas huit minutes.
      #
      # Ce controle porte sur les NOMS de tables, pas sur leur structure : il
      # attrape une table entiere oubliee dans schema.sql, pas une colonne. Cf.
      # l en-tete de scripts/validate-schema.cjs, et CLAUDE.md § sous-audit D.
      - name: Hygiene du schema (fail-fast)
        run: npm run validate:schema

      # ⚠ BORNE D'ETAPE — pour que l'incident soit LISIBLE, pas opaque.
      #
      # Cette etape a fait tuer le job DEUX FOIS au plafond de 15 min (runs
      # 32272439650 et 32278755038). La cause est mesuree, et ce n'est PAS le
      # telechargement des navigateurs : `--with-deps` appelle apt, et le miroir
      # azure.archive.ubuntu.com ne repondait pas — 25 `Ign:` en boucle, et le
      # CDN Playwright JAMAIS sollicite. Cf. CLAUDE.md § Patterns CI.
      #
      # 9 min contre un maximum REUSSI de 248 s sur ce job (10 runs mesures :
      # 21, 21, 23, 31, 34, 84, 132, 133, 234, 248) : plus du double de marge,
      # donc aucun profil vert n'est casse. Un miroir bloque echoue desormais en
      # 9 min avec un message explicite, au lieu d'annuler le job a 15 sans
      # produire ni test ni artefact.
      #
      # PAS DE RETRY ICI, et c'est mesure aussi : le budget du job (900 s moins
      # ~360 s de tests) ne laisse pas la place a deux essais assez larges pour
      # ne pas couper des runs verts. A rouvrir si le plafond du job monte.
      - name: Install Playwright browsers (chromium only)
        timeout-minutes: 9
        run: npx playwright install chromium --with-deps

      - name: Start Vite dev server (and wait for ready)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          nohup npm run dev -- --port 5174 --strictPort > /tmp/vite.log 2>&1 &
          echo "VITE_PID=$!" >> $GITHUB_ENV
          npx wait-on http://localhost:5174 -t 60000
          echo "✓ Vite dev server ready on :5174"

      - name: Agent validation données
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/agents/validation-donnees.cjs
        continue-on-error: true

      - name: Agent erreurs console (chromium uniquement)
        env:
          CONSOLE_SKIP_BROWSERS: webkit-desktop,mobile-safari
        run: node scripts/agents/console-errors.cjs
        continue-on-error: true

      - name: Agent accessibilité axe (chromium uniquement)
        env:
          A11Y_SKIP_BROWSERS: webkit-desktop,mobile-safari
        run: node scripts/agents/a11y-axe.cjs
        continue-on-error: true

      - name: Agent E2E (chromium uniquement)
        env:
          E2E_PROJECTS: chromium-desktop
        run: node scripts/agents/playwright-e2e.cjs
        continue-on-error: true

      - name: Vérification baseline
        run: node scripts/qa-check-baseline.cjs --strict

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-pr-${{ github.event.pull_request.number }}
          path: qa-reports/
          retention-days: 14

      - name: Résumé QA
        if: always()
        run: |
          echo "## Rapport QA · PR #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d qa-reports ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            node scripts/qa-check-baseline.cjs --json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo '{"error": "baseline check unavailable"}' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠ qa-reports absent — aucun agent n'a tourné." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Voir les **Artifacts** de ce run pour les rapports détaillés." >> $GITHUB_STEP_SUMMARY

  qa-full:
    name: QA complet (push main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ⚠ FAIL-FAST — avant l installation de Playwright, comme validate:chateaux
      # (PR #12). Une derive de schema doit couter 5 secondes, pas huit minutes.
      #
      # Ce controle porte sur les NOMS de tables, pas sur leur structure : il
      # attrape une table entiere oubliee dans schema.sql, pas une colonne. Cf.
      # l en-tete de scripts/validate-schema.cjs, et CLAUDE.md § sous-audit D.
      - name: Hygiene du schema (fail-fast)
        run: npm run validate:schema

      # Meme borne d'etape, mais PAS la meme valeur — les profils different.
      # Ce job installe webkit EN PLUS et dispose de 60 min ; il n'a jamais ete
      # annule. Surtout, un run VERT y a mis 1564 s (26 min) sur cette seule
      # etape. Une borne a 9 min le tuerait : elle transformerait un succes en
      # echec, exactement ce qu'on cherche a eviter.
      # 30 min laisse donc passer le profil observe le plus lent, tout en
      # coupant a la moitie du plafond si le miroir se bloque pour de bon.
      - name: Install Playwright browsers (chromium + webkit)
        timeout-minutes: 30
        run: npx playwright install chromium webkit --with-deps

      - name: Start Vite dev server (and wait for ready)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          nohup npm run dev -- --port 5174 --strictPort > /tmp/vite.log 2>&1 &
          echo "VITE_PID=$!" >> $GITHUB_ENV
          npx wait-on http://localhost:5174 -t 60000
          echo "✓ Vite dev server ready on :5174"

      - name: QA fast complet (4 agents, 3 navigateurs — tentative mobile-safari)
        env:
          E2E_PROJECTS: chromium-desktop,webkit-desktop,mobile-safari
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run qa:fast
        continue-on-error: true

      - name: Vérification baseline
        run: node scripts/qa-check-baseline.cjs --strict

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ github.sha }}
          path: qa-reports/
          retention-days: 30

      - name: Résumé QA
        if: always()
        run: |
          echo "## Rapport QA · push ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d qa-reports ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            node scripts/qa-check-baseline.cjs --json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo '{"error": "baseline check unavailable"}' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠ qa-reports absent — aucun agent n'a tourné." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Voir les **Artifacts** de ce run pour les rapports détaillés." >> $GITHUB_STEP_SUMMARY
